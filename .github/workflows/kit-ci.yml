name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hdh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hdh_test
    defaults:
      run:
        working-directory: health-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            health-mcp/package-lock.json
            notion-reporter/package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - name: notion-reporter install
        working-directory: notion-reporter
        run: npm ci
      - name: notion-reporter unit tests
        working-directory: notion-reporter
        run: npm test
      - name: notion-reporter integration tests
        working-directory: notion-reporter
        run: npm run test:integration
      - name: dashboard install
        working-directory: dashboard
        run: npm ci
      - name: dashboard unit tests
        working-directory: dashboard
        run: npm test
      - name: dashboard integration tests
        working-directory: dashboard
        run: npm run test:integration
